service: api-alumnos

package:
  patterns:
    - '!tests/**'
    - '!README.md'
    - '!*.postman_collection.json'
    - '!__pycache__/**'

provider:
  name: aws
  runtime: python3.12
  region: ${opt:region, 'us-east-1'}
  stage: ${opt:stage, 'dev'}
  timeout: 30
  iam:
    role: arn:aws:iam::${aws:accountId}:role/LabRole
  environment:
    ALUMNOS_TABLE: ${env:ALUMNOS_TABLE, 't_alumnos'}

functions:
  listar:
    handler: ListarAlumnos.lambda_handler
    events:
      - http:
          path: alumnos/listar
          method: post
          cors: true
  crear:
    handler: CrearAlumno.lambda_handler
    events:
      - http:
          path: alumnos/crear
          method: post
          cors: true
  modificar:
    handler: ModificarAlumno.lambda_handler
    events:
      - http:
          path: alumnos/modificar
          method: post
          cors: true
  eliminar:
    handler: EliminarAlumno.lambda_handler
    events:
      - http:
          path: alumnos/eliminar
          method: post
          cors: true
  buscar:
    handler: BuscarAlumno.lambda_handler
    events:
      - http:
          path: alumnos/buscar
          method: post
          cors: true
